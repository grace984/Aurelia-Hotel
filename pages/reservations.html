    <!-- MAIN CONTENT - Reservation Form -->
    <main class="form-container">
        <div class="container">
            <div class="form-card animate-fade-in">
                <div class="form-header">
                    <div class="form-title-badge">
                        <h2>Book Your Stay</h2>
                    </div>
                </div>

                <form id="bookingForm" action="#" method="POST">
                    <!-- Full Name -->
                    <div class="form-group">
                        <label for="fullName" class="form-label">Full Name</label>
                        <input 
                            type="text" 
                            id="fullName" 
                            name="fullName" 
                            class="form-input" 
                            placeholder="Enter your full name"
                            required
                        >
                    </div>

                    <!-- Email Address -->
                    <div class="form-group">
                        <label for="email" class="form-label">Email Address</label>
                        <input 
                            type="email" 
                            id="email" 
                            name="email" 
                            class="form-input" 
                            placeholder="Enter your email address"
                            required
                        >
                    </div>

                    <!-- Check-in and Check-out -->
                    <div class="form-row">
                        <div class="form-group">
                            <label for="checkIn" class="form-label">Check-In</label>
                            <div class="date-input-wrapper">
                                <input 
                                    type="date" 
                                    id="checkIn" 
                                    name="checkIn" 
                                    class="form-input"
                                    required
                                >
                                <i class="bi bi-calendar-check date-icon"></i>
                            </div>
                        </div>
                        <div class="form-group">
                            <label for="checkOut" class="form-label">Check-out</label>
                            <div class="date-input-wrapper">
                                <input 
                                    type="date" 
                                    id="checkOut" 
                                    name="checkOut" 
                                    class="form-input"
                                    required
                                >
                                <i class="bi bi-calendar-check date-icon"></i>
                            </div>
                        </div>
                    </div>

                    <!-- Room Type Selection -->
                    <div class="form-group room-selection">
                        <label class="form-label">Room Type</label>
                        <div class="room-options">
                            <label class="room-option">
                                <input type="radio" name="roomType" value="standard" required>
                                <div class="room-type-name">Standard Room</div>
                                <div class="room-type-price">$120/night</div>
                                <div class="room-type-desc">Cozy room with city view</div>
                            </label>
                            <label class="room-option">
                                <input type="radio" name="roomType" value="deluxe">
                                <div class="room-type-name">Deluxe Suite</div>
                                <div class="room-type-price">$220/night</div>
                                <div class="room-type-desc">Spacious with ocean view</div>
                            </label>
                            <label class="room-option">
                                <input type="radio" name="roomType" value="presidential">
                                <div class="room-type-name">Presidential</div>
                                <div class="room-type-price">$450/night</div>
                                <div class="room-type-desc">Luxury with all amenities</div>
                            </label>
                        </div>
                    </div>

                    <!-- Checkboxes -->
                    <div class="checkbox-group">
                        <input type="checkbox" id="offers" name="offers" class="checkbox-input">
                        <label for="offers" class="checkbox-label">
                            I would like to receive exclusive offers and updates.
                        </label>
                    </div>

                    <div class="checkbox-group">
                        <input type="checkbox" id="terms" name="terms" class="checkbox-input" required>
                        <label for="terms" class="checkbox-label">
                            I agree to the Terms of Service and Privacy Policy.
                        </label>
                    </div>

                    <!-- Payment Section -->
                    <div class="payment-section">
                        <h3 class="payment-title">Select Payment Method</h3>
                        
                        <div class="payment-methods">
                            <!-- Credit/Debit Card -->
                            <label class="payment-method active">
                                <input type="radio" name="paymentMethod" value="card" checked>
                                <div class="card-icons">
                                    <div class="card-icon">VISA</div>
                                </div>
                                <span class="payment-label">Credit / Debit Card</span>
                            </label>

                            <!-- PayPal -->
                            <label class="payment-method">
                                <input type="radio" name="paymentMethod" value="paypal">
                                <svg class="payment-icon" viewBox="0 0 24 24" fill="#0070ba">
                                    <path d="M7.076 21.337H2.47a.641.641 0 0 1-.633-.74L4.944.901C5.026.382 5.474 0 5.998 0h7.46c2.57 0 4.578.543 5.69 1.81 1.01 1.15 1.304 2.42 1.012 4.287-.023.143-.047.288-.077.437-.983 5.05-4.349 6.797-8.647 6.797h-2.19c-.524 0-.968.382-1.05.9l-1.12 7.106zm14.146-14.42a3.35 3.35 0 0 0-.607-.541c-.013.076-.026.175-.041.254-.59 3.025-2.566 6.082-8.558 6.082H9.63l-1.496 9.478h2.79c.457 0 .85-.334.922-.788l.04-.19.73-4.627.047-.255a.933.933 0 0 1 .922-.788h.58c3.76 0 6.704-1.528 7.565-5.946.318-1.63.196-2.987-.507-3.689z"/>
                                </svg>
                                <span class="payment-label">PayPal</span>

                        </div>

                        <!-- Credit Card Form -->

                            <div class="card-input-row">

                            <div class="form-group">

                        <!-- PayPal Button (hidden by default) -->

                                </svg>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"

    <script>
        // Room selection styling
        document.querySelectorAll('.room-option').forEach(option => {
            option.addEventListener('click', function() {
                document.querySelectorAll('.room-option').forEach(o => o.classList.remove('selected'));
                this.classList.add('selected');
            });
        });

        // Payment method toggle
        document.querySelectorAll('input[name="paymentMethod"]').forEach(radio => {
            radio.addEventListener('change', function() {
                // Update active class
                document.querySelectorAll('.payment-method').forEach(m => m.classList.remove('active'));
                this.closest('.payment-method').classList.add('active');
                
                // Toggle forms
                const cardForm = document.getElementById('cardForm');
                const paypalForm = document.getElementById('paypalForm');
                
                if (this.value === 'card') {
                    cardForm.classList.remove('hidden');
                    paypalForm.classList.add('hidden');
                } else {
                    cardForm.classList.add('hidden');
                    paypalForm.classList.remove('hidden');
                }
            });
        });

        // Card number formatting
        document.getElementById('cardNumber').addEventListener('input', function(e) {
            let value = e.target.value.replace(/\s/g, '');
            value = value.replace(/\D/g, '');
            value = value.substring(0, 16);
            let formattedValue = '';
            for (let i = 0; i < value.length; i += 4) {
                formattedValue += value.substring(i, i + 4) + ' ';
            }
            e.target.value = formattedValue.trim();
        });

        // Expiry date formatting
        document.getElementById('expDate').addEventListener('input', function(e) {
            let value = e.target.value.replace(/\D/g, '');
            if (value.length >= 2) {
                value = value.substring(0, 2) + '/' + value.substring(2, 4);
            }
            e.target.value = value;
        });

        // Form submission
        document.getElementById('bookingForm').addEventListener('submit', function(e) {
            e.preventDefault();
            alert('Thank you for your booking! We will send a confirmation email shortly.');
        });

        // Set minimum date for check-in (today)
        const today = new Date().toISOString().split('T')[0];
        document.getElementById('checkIn').setAttribute('min', today);
        
        // Update check-out min when check-in changes
        document.getElementById('checkIn').addEventListener('change', function() {
            document.getElementById('checkOut').setAttribute('min', this.value);
        });
    </script>
